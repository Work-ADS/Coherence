<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="system-ui, -apple-system, sans-serif">
  <style>
    @keyframes marker-pos {
      0%, 15% { transform: translateX(0px); }
      45%, 70% { transform: translateX(120px); }
      95%, 100% { transform: translateX(0px); }
    }
    @keyframes marker-label-now {
      0%, 20% { opacity: 1; }
      30%, 70% { opacity: 0; }
      80%, 100% { opacity: 1; }
    }
    @keyframes marker-label-target {
      0%, 25% { opacity: 0; }
      35%, 65% { opacity: 1; }
      75%, 100% { opacity: 0; }
    }
    @keyframes bar-current-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    .marker { animation: marker-pos 5s ease-in-out infinite; }
    .label-now { animation: marker-label-now 5s ease-in-out infinite; }
    .label-target { animation: marker-label-target 5s ease-in-out infinite; }
    .bar-pulse { animation: bar-current-pulse 2.5s ease-in-out infinite; }
  </style>

  <rect width="700" height="360" fill="#F5F6FA"/>

  <text x="350" y="32" fill="#94A3B8" font-size="11" letter-spacing="1" text-anchor="middle">CINCO ESTADOS DE MADUREZ</text>
  <text x="350" y="56" fill="#1A2434" font-size="17" font-weight="600" text-anchor="middle">De Gestionado a Definido: el salto inmediato</text>

  <!-- Bars (5 stages, increasing height). Baseline at y=280 -->
  <!-- Bar 1: Ad hoc, h=30 -->
  <rect x="80" y="250" width="60" height="30" rx="4" fill="#E2E8F0"/>
  <text x="110" y="300" fill="#6B7280" font-size="11" text-anchor="middle">Ad hoc</text>

  <!-- Bar 2: Managed, h=60 — AFI HOY (highlighted) -->
  <rect class="bar-pulse" x="200" y="220" width="60" height="60" rx="4" fill="#3B82F6"/>
  <text x="230" y="300" fill="#1A2434" font-size="11" font-weight="600" text-anchor="middle">Gestionado</text>

  <!-- Bar 3: Defined, h=90 — AFI MAÑANA (dashed outline) -->
  <rect x="320" y="190" width="60" height="90" rx="4" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="350" y="300" fill="#3B82F6" font-size="11" font-weight="600" text-anchor="middle">Definido</text>

  <!-- Bar 4: Optimized, h=120 -->
  <rect x="440" y="160" width="60" height="120" rx="4" fill="#E2E8F0"/>
  <text x="470" y="300" fill="#6B7280" font-size="11" text-anchor="middle">Optimizado</text>

  <!-- Bar 5: Adaptive, h=150 -->
  <rect x="560" y="130" width="60" height="150" rx="4" fill="#E2E8F0"/>
  <text x="590" y="300" fill="#6B7280" font-size="11" text-anchor="middle">Adaptativo</text>

  <!-- Baseline -->
  <line x1="60" y1="280" x2="640" y2="280" stroke="#CBD5E0" stroke-width="1.5"/>

  <!-- Moving marker (chevron) above current bar.
       Outer group holds the static position; the CSS transform animation
       lives on the inner group so it doesn't override the placement. -->
  <g transform="translate(230, 195)">
    <g class="marker">
      <circle cx="0" cy="0" r="8" fill="#3B82F6"/>
      <circle cx="0" cy="0" r="14" fill="#3B82F6" opacity="0.2"/>
      <text x="0" y="-18" fill="#1A2434" font-size="10" font-weight="600" letter-spacing="0.5" text-anchor="middle" class="label-now">AFI HOY</text>
      <text x="0" y="-18" fill="#3B82F6" font-size="10" font-weight="600" letter-spacing="0.5" text-anchor="middle" class="label-target">AFI MAÑANA</text>
    </g>
  </g>

  <!-- Path between current and target -->
  <line x1="230" y1="218" x2="350" y2="188" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- Caption -->
  <text x="350" y="335" fill="#6B7280" font-size="12" text-anchor="middle">El salto no se cierra contratando mejor diseño — se cierra cambiando cómo se decide aguas abajo</text>
</svg>
