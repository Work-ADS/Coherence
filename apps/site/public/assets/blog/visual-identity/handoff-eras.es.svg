<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="system-ui, -apple-system, sans-serif">
  <style>
    @keyframes stage-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    .stage-pulse { animation: stage-pulse 2.5s ease-in-out infinite; }
  </style>

  <rect width="700" height="360" fill="#F5F6FA"/>

  <text x="350" y="32" fill="#94A3B8" font-size="11" letter-spacing="1" text-anchor="middle">CUATRO ERAS DE ENTREGA</text>
  <text x="350" y="56" fill="#1A2434" font-size="17" font-weight="600" text-anchor="middle">Cómo llega el diseño al código en Afi</text>

  <!-- Timeline spine -->
  <line x1="60" y1="200" x2="640" y2="200" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Etapa 1: PNG -->
  <circle cx="110" cy="200" r="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="75" y="110" width="70" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="90" y="122" width="40" height="30" rx="3" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="99" cy="131" r="3" fill="#94A3B8"/>
  <path d="M92 148 L104 137 L112 144 L120 136 L128 148 Z" fill="#94A3B8"/>
  <text x="110" y="236" fill="#6B7280" font-size="11" font-weight="600" text-anchor="middle">PNG</text>
  <text x="110" y="252" fill="#94A3B8" font-size="10" text-anchor="middle">imágenes por correo</text>

  <!-- Etapa 2: Pantallas de Figma -->
  <circle cx="270" cy="200" r="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="235" y="110" width="70" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <line x1="252" y1="126" x2="288" y2="126" stroke="#94A3B8" stroke-width="2"/>
  <line x1="252" y1="148" x2="288" y2="148" stroke="#94A3B8" stroke-width="2"/>
  <line x1="257" y1="120" x2="257" y2="154" stroke="#94A3B8" stroke-width="2"/>
  <line x1="283" y1="120" x2="283" y2="154" stroke="#94A3B8" stroke-width="2"/>
  <text x="270" y="236" fill="#6B7280" font-size="11" font-weight="600" text-anchor="middle">Pantallas de Figma</text>
  <text x="270" y="252" fill="#94A3B8" font-size="10" text-anchor="middle">flujos, sin sistema</text>

  <!-- Etapa 3: Componentes Material -->
  <circle cx="430" cy="200" r="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="395" y="110" width="70" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="408" y="120" width="44" height="34" rx="4" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <rect x="408" y="120" width="44" height="12" rx="4" fill="#E2E8F0"/>
  <line x1="413" y1="140" x2="440" y2="140" stroke="#94A3B8" stroke-width="2"/>
  <line x1="413" y1="147" x2="430" y2="147" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="236" fill="#6B7280" font-size="11" font-weight="600" text-anchor="middle">Componentes Material</text>
  <text x="430" y="252" fill="#94A3B8" font-size="10" text-anchor="middle">sistematizado, con opiniones</text>

  <!-- Etapa 4: Sistema propio (destacada) -->
  <circle class="stage-pulse" cx="590" cy="200" r="8" fill="#3B82F6"/>
  <rect x="555" y="106" width="70" height="60" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <path d="M578 126 L568 137 L578 148" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M602 126 L612 137 L602 148" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="594" y1="124" x2="586" y2="150" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="590" y="236" fill="#1A2434" font-size="11" font-weight="600" text-anchor="middle">Sistema propio</text>
  <text x="590" y="252" fill="#3B82F6" font-size="10" font-weight="600" text-anchor="middle">en código, con IA</text>

  <!-- Marcador ahora -->
  <rect x="552" y="286" width="76" height="22" rx="11" fill="#3B82F6"/>
  <text x="590" y="301" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">AHORA</text>
</svg>
