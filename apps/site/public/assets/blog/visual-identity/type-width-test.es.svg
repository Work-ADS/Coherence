<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="system-ui, -apple-system, sans-serif">
  <rect width="700" height="360" fill="#F5F6FA"/>

  <text x="350" y="32" fill="#94A3B8" font-size="11" letter-spacing="1" text-anchor="middle">LA PRUEBA DEL ANCHO DE CIFRAS</text>
  <text x="350" y="56" fill="#1A2434" font-size="17" font-weight="600" text-anchor="middle">0000 frente a 4444: ¿se mantiene el ancho?</text>

  <line x1="220" y1="80" x2="220" y2="300" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="400" y1="80" x2="400" y2="300" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Fila 1: Space Grotesk — varía -->
  <text x="60" y="112" fill="#6B7280" font-size="12" font-weight="600">Space Grotesk</text>
  <rect x="220" y="96" width="180" height="20" rx="4" fill="#E2E8F0"/>
  <text x="228" y="111" fill="#6B7280" font-size="12" font-family="ui-monospace, monospace">0000</text>
  <rect x="220" y="122" width="196" height="20" rx="4" fill="#E2E8F0"/>
  <text x="228" y="137" fill="#6B7280" font-size="12" font-family="ui-monospace, monospace">4444</text>
  <rect x="402" y="122" width="14" height="20" fill="#EF4444" opacity="0.35"/>
  <text x="430" y="137" fill="#EF4444" font-size="11" font-weight="600">varía</text>

  <!-- Fila 2: Fira Sans — varía -->
  <text x="60" y="186" fill="#6B7280" font-size="12" font-weight="600">Fira Sans</text>
  <rect x="220" y="170" width="180" height="20" rx="4" fill="#E2E8F0"/>
  <text x="228" y="185" fill="#6B7280" font-size="12" font-family="ui-monospace, monospace">0000</text>
  <rect x="220" y="196" width="170" height="20" rx="4" fill="#E2E8F0"/>
  <text x="228" y="211" fill="#6B7280" font-size="12" font-family="ui-monospace, monospace">4444</text>
  <rect x="390" y="196" width="10" height="20" fill="#EF4444" opacity="0.35"/>
  <text x="430" y="211" fill="#EF4444" font-size="11" font-weight="600">varía</text>

  <!-- Fila 3: IBM Plex Sans — se mantiene -->
  <text x="60" y="260" fill="#1A2434" font-size="12" font-weight="600">IBM Plex Sans</text>
  <rect x="220" y="244" width="180" height="20" rx="4" fill="#3B82F6" opacity="0.15"/>
  <text x="228" y="259" fill="#1A2434" font-size="12" font-family="ui-monospace, monospace">0000</text>
  <rect x="220" y="270" width="180" height="20" rx="4" fill="#3B82F6" opacity="0.15"/>
  <text x="228" y="285" fill="#1A2434" font-size="12" font-family="ui-monospace, monospace">4444</text>
  <path d="M428 272 L434 279 L446 265" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="456" y="281" fill="#3B82F6" font-size="11" font-weight="600">se mantiene</text>

  <text x="350" y="330" fill="#94A3B8" font-size="10.5" text-anchor="middle" font-style="italic">Las barras muestran el ancho de línea según el patrón de cifras. Las cifras que cambian de ancho hacen bailar tablas y gráficas.</text>
</svg>
