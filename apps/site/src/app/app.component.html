<div class="shell">

  <!-- Single-column shell — the old contextual section sidebar was retired
       2026-07-21 with the new nav bar; every route navigates from the glass
       top bar alone. Section routes (/componentes, /patrones, /fundamentos)
       stay reachable by URL, just without their old sidebar trees. -->
  <div class="main-column">

    <!-- Top bar — hidden on demo / insights routes (they bring their own chrome).
         On the homepage we render the bar with only the right-side controls
         (no nav links) so language/brand/theme stay reachable from the hero. -->
    @if (!isFullScreenRoute()) {
      <!-- .on-dark: adaptive contrast — flips the bar to the inverse palette
           while content tagged data-nav-tone="dark" scrolls behind the frost. -->
      <afi-top-bar variant="glass" [class.on-dark]="navOnDark()">
        @if (!isHomepage()) {
          <!-- Nav bar — Figma AFI-FOUNDATIONS-MODERN 2974:5945. Logo (→home)
               left, menu items centered, language toggle right; the bar opts
               into the modern foundation (IBM Plex + v2 tokens) via
               data-foundation="modern". Fundamentos / Componentes / Patrones
               stay off the bar while the v2 primitives are in flight (routes
               remain live). Labels match the Figma; 'Example' is a provisional
               link to the demos index until the dashboard examples are defined. -->
          <div slot="start" class="site-nav" data-foundation="modern">
            <coherence-logo [variant]="navOnDark() ? 'monochrome' : 'color'" size="sm" href="/" />
            <nav class="site-nav__menu" aria-label="Main navigation">
              <afi-navbar-item-v2
                label="Design at Afi"
                [selected]="isActive('/metodologia')"
                (selectedChange)="navigate('/metodologia')" />
              <afi-navbar-item-v2
                label="Workbench"
                [selected]="isActive('/demos/foundations-modern/workbench')"
                (selectedChange)="navigate('/demos/foundations-modern/workbench')" />
              <afi-navbar-item-v2
                label="Example"
                [selected]="isActive('/demos')"
                (selectedChange)="navigate('/demos')" />
            </nav>
          </div>
        }

        <div slot="end" class="top-bar__end" data-foundation="modern">
          <site-language-toggle />
          <!--
            <site-brand-picker /> hidden 2026-05-26 and <site-theme-toggle />
            hidden 2026-07-21 (modern foundation is light-only). Restore either
            by re-adding the element here plus its import + `imports` entry in
            app.ts.
          -->
        </div>
      </afi-top-bar>
    }

    <!-- Main content -->
    <main class="content" [class.content--offset]="!isFullScreenRoute()" id="main-content">
      <router-outlet />
    </main>
  </div>
</div>

@if (!isFullScreenRoute()) {
  <site-feedback-overlay />
}
