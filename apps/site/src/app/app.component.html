@if (unlocked()) {
<div class="shell">

  <!-- Sidebar: logo + section nav (hidden on fullscreen/homepage) -->
  @if (showSidebar()) {
    <afi-sidebar mode="static" ariaLabel="Section navigation">
      <div slot="top">
        <coherence-logo variant="color" size="sm" href="/" />
      </div>

      <!-- Components section -->
      <afi-nav-section label="Components" [defaultExpanded]="true" [showTreeLines]="true" chevronPosition="right">
        <afi-nav-item label="Logo" [showIcon]="false" [active]="isActive('/componentes/logo')" (clicked)="navigate('/componentes/logo')" />
        <afi-nav-item label="Segmented Control" [showIcon]="false" [active]="isActive('/componentes/segmented-control')" (clicked)="navigate('/componentes/segmented-control')" />
        <afi-nav-item label="Tabs" [showIcon]="false" [active]="isActive('/componentes/tabs')" (clicked)="navigate('/componentes/tabs')" />
        <afi-nav-item label="Nav Item" [showIcon]="false" [active]="isActive('/componentes/nav-item')" (clicked)="navigate('/componentes/nav-item')" />
        <afi-nav-item label="Icon Button" [showIcon]="false" [active]="isActive('/componentes/icon-button')" (clicked)="navigate('/componentes/icon-button')" />
        <afi-nav-item label="Inline Edit" [showIcon]="false" [active]="isActive('/componentes/inline-edit')" (clicked)="navigate('/componentes/inline-edit')" />
        <afi-nav-item label="Status Chip" [showIcon]="false" [active]="isActive('/componentes/status-chip')" (clicked)="navigate('/componentes/status-chip')" />
        <afi-nav-item label="Filter Chip" [showIcon]="false" [active]="isActive('/componentes/filter-chip')" (clicked)="navigate('/componentes/filter-chip')" />
      </afi-nav-section>

      <!-- Patterns section -->
      <afi-nav-section label="Patterns" [defaultExpanded]="true" [showTreeLines]="true" chevronPosition="right">
        <afi-nav-item label="Sidebar" [showIcon]="false" [active]="isActive('/componentes/sidebar')" (clicked)="navigate('/componentes/sidebar')" />
        <afi-nav-item label="Headers" [showIcon]="false" [active]="isActive('/patrones/cabeceras/cabecera-de-pagina')" (clicked)="navigate('/patrones/cabeceras/cabecera-de-pagina')" />
        <afi-nav-item label="Dropdown" [showIcon]="false" [active]="isActive('/patrones/selectores/dropdown')" (clicked)="navigate('/patrones/selectores/dropdown')" />
      </afi-nav-section>
    </afi-sidebar>
  }

  <!-- Right column: top bar + content -->
  <div class="main-column">

    <!-- Top bar (nav tabs left, theme toggle right) — hidden on homepage/fullscreen -->
    @if (!isFullScreenRoute() && !isHomepage()) {
      <afi-top-bar>
        <nav slot="start" class="top-nav" aria-label="Main navigation">
          <a routerLink="/fundamentos" routerLinkActive="active" class="top-nav__link">Foundations</a>
          <a routerLink="/componentes" routerLinkActive="active" class="top-nav__link">Components</a>
          <!-- <a routerLink="/patrones" routerLinkActive="active" class="top-nav__link">Patterns</a> -->
          <a routerLink="/demos" routerLinkActive="active" class="top-nav__link">Demos</a>
          <a routerLink="/blog" routerLinkActive="active" class="top-nav__link">Blog</a>
        </nav>

        <div slot="end" class="top-bar__end">
          <site-brand-picker />
          <site-theme-toggle />
        </div>
      </afi-top-bar>
    }

    <!-- Main content -->
    <main class="content" id="main-content">
      <router-outlet />
    </main>
  </div>
</div>

@if (!isFullScreenRoute()) {
  <site-feedback-overlay />
}
} @else {
<site-password-gate (unlocked)="onUnlocked()" />
}
