<div
  class="composer"
  [class.composer--left]="pos().placement === 'left'"
  [style.top.px]="pos().top"
  [style.left.px]="pos().left"
  role="dialog"
  aria-label="Nuevo comentario"
>
  <code class="composer__selector">{{ selector() }}</code>

  <afi-input
    #inputRef
    type="textarea"
    class="composer__input"
    placeholder="Deja un comentario… (Enter para publicar, Shift+Enter para salto de línea)"
    [value]="text()"
    (valueChange)="onInput($event)"
    (keydown)="onKeyDown($event)"
    ariaLabel="Texto del comentario"
  />

  <div class="composer__actions">
    <afi-button variant="ghost" size="sm" (clicked)="cancel()">Cancelar</afi-button>
    <afi-button
      variant="primary"
      size="sm"
      [disabled]="!canSubmit()"
      (clicked)="submit()"
    >Publicar</afi-button>
  </div>
</div>
