<svg
  class="slides"
  viewBox="0 0 48 48"
  fill="none"
  aria-hidden="true"
  focusable="false"
>
  <!-- Three stacked slide cards (a deck) — shift right on hover. -->
  <rect class="slides__card slides__card--1" x="6"  y="14" width="20" height="14" rx="2" />
  <rect class="slides__card slides__card--2" x="11" y="17" width="20" height="14" rx="2" />
  <rect class="slides__card slides__card--3" x="16" y="20" width="20" height="14" rx="2" />

  <!-- Forward arrow — slides in from the left on hover. -->
  <path
    class="slides__arrow"
    d="M34 27 L40 27 M37 24 L40 27 L37 30"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
