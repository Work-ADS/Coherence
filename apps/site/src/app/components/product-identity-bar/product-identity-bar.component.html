<header class="pib" role="banner">
  <div class="pib__identity">
    <span class="pib__mark" aria-hidden="true">
      <svg viewBox="0 0 32 12" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <text x="0" y="10" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">Afi</text>
        <path d="M14 6c0-1.5 1-3 3-3s3 1.5 3 3-1 3-3 3-3-1.5-3-3zm6 0c0-1.5 1-3 3-3s3 1.5 3 3-1 3-3 3-3-1.5-3-3z" fill="currentColor" opacity="0.85"/>
      </svg>
    </span>
    <span class="pib__product">{{ productLabel() }}</span>
  </div>

  <div class="pib__context">
    @if (breadcrumb().length > 0) {
      <nav class="pib__crumbs" aria-label="Breadcrumb">
        @for (step of breadcrumb(); track step.label) {
          @if (step.route) {
            <a [routerLink]="step.route" class="pib__crumb pib__crumb--link">{{ step.label }}</a>
          } @else {
            <span class="pib__crumb">{{ step.label }}</span>
          }
          <span class="pib__crumb-sep" aria-hidden="true">/</span>
        }
      </nav>
    }
    <h1 class="pib__title">{{ pageTitle() }}</h1>
  </div>
</header>
