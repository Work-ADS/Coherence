<section class="blog-landing">
  <header class="blog-landing__header">
    <p class="blog-landing__eyebrow">{{ headerCopy().eyebrow }}</p>
    <h1 class="blog-landing__title">{{ headerCopy().title }}</h1>
    <p class="blog-landing__intro">{{ headerCopy().intro }}</p>
  </header>

  <ul class="blog-landing__list">
    @for (post of posts(); track post.slug) {
      <li class="blog-landing__item">
        <a
          class="blog-landing__card"
          [routerLink]="post.to || ('/blog/' + post.slug)"
          [attr.aria-label]="post.title + ' — ' + post.eyebrow"
        >
          <div
            class="blog-landing__card-thumb blog-landing__card-thumb--{{ post.thumb }}"
            [attr.data-nav-tone]="post.darkThumb ? 'dark' : null"
            aria-hidden="true"
          >
            <!-- Whitelabel: brand stripes that swap on hover -->
            @if (post.thumb === 'whitelabel') {
              <div class="thumb-wl">
                <span class="thumb-wl__stripe thumb-wl__stripe--1"></span>
                <span class="thumb-wl__stripe thumb-wl__stripe--2"></span>
                <span class="thumb-wl__stripe thumb-wl__stripe--3"></span>
                <span class="thumb-wl__stripe thumb-wl__stripe--4"></span>
              </div>
            }
            <!-- Talk: 3 mini slide cards that shift right on hover (suggests arrow navigation) -->
            @if (post.thumb === 'talk') {
              <div class="thumb-talk">
                <span class="thumb-talk__card thumb-talk__card--1"></span>
                <span class="thumb-talk__card thumb-talk__card--2"></span>
                <span class="thumb-talk__card thumb-talk__card--3"></span>
                <span class="thumb-talk__arrow" aria-hidden="true">→</span>
              </div>
            }
            <!-- Video: looping MP4, autoplays muted -->
            @if (post.thumb === 'video' && post.videoSrc) {
              <video
                class="thumb-video"
                [src]="post.videoSrc"
                [poster]="post.videoPoster || ''"
                loop
                playsinline
                preload="auto"
                (loadedmetadata)="playMuted($event)"
                (canplay)="playMuted($event)"
                (loadeddata)="playMuted($event)"
                (waiting)="playMuted($event)"
                (pause)="playMuted($event)"
              ></video>
            }
          </div>
        </a>
      </li>
    }
  </ul>
</section>
