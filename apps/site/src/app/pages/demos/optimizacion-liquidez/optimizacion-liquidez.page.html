<site-objetivos-page-shell
  [views]="['Optimización de la liquidez']"
  demoSlug="optimizacion-liquidez"
  demoRoute="/demos/wealth-planner-2026/optimizacion-liquidez"
  activeKey="optimizacion-liquidez"
  versionAriaLabel="Versión del layout de Optimización de la liquidez"
>
  <afi-page-header
    title="Optimización de la liquidez"
    subtitle="La optimización de la liquidez simula que en todos los años en que se genera un exceso de ahorro, este se invierte según el perfil de riesgo establecido en esta pantalla. En los años en que existe un déficit de liquidez, se simula que el déficit se cubre con el ahorro previamente generado."
    [sticky]="false"
    [scrollFade]="false"
  >
    <afi-switch
      slot="actions"
      label="¿Quieres activar la optimización de la liquidez?"
      hint="Activa para definir el perfil y ver las proyecciones."
      [checked]="store.optimizacionLiquidezEstablished()"
      (checkedChange)="setOptimizacionLiquidezEstablished($event)"
    />

    @if (store.optimizacionLiquidezEstablished()) {
      <div class="ol-stack">
        <afi-page-header
          level="section"
          title="Evolución esperada del exceso de liquidez"
          [sticky]="false"
          [scrollFade]="false"
        >
          <afi-icon-button
            slot="actions"
            variant="ghost"
            size="sm"
            ariaLabel="Descargar gráfico"
            (clicked)="exportChart()"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
          </afi-icon-button>

          <span slot="filters" class="ol-chip-anchor">
            <button
              #perfilTrigger
              type="button"
              class="ol-chip"
              aria-haspopup="menu"
              [attr.aria-expanded]="perfilMenuOpen()"
              (click)="perfilMenuOpen.set(!perfilMenuOpen())"
            >
              <span class="ol-chip__label">Perfil de riesgo</span>
              <span class="ol-chip__divider" aria-hidden="true"></span>
              <span class="ol-chip__value">{{ perfilLabel() }}</span>
              <svg class="ol-chip__caret" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path
                  fill-rule="evenodd"
                  d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
                  clip-rule="evenodd"
                />
              </svg>
            </button>
            <afi-menu
              [open]="perfilMenuOpen()"
              [anchor]="perfilTrigger"
              placement="bottom-start"
              ariaLabel="Perfil de riesgo"
              (openChange)="perfilMenuOpen.set($event)"
            >
              @for (opt of perfilOptions; track opt.value) {
                <afi-menu-item [label]="opt.label" (clicked)="setPerfilRiesgo(opt.value)" />
              }
            </afi-menu>
          </span>

          <site-liquidez-evolucion-chart
            [series]="chartSeries()"
            [anoBreakdown]="anoBreakdown()"
            [acumuladoBreakdown]="acumuladoBreakdown()"
          />
        </afi-page-header>

        <afi-page-header
          level="section"
          title="Resumen de rentabilidades generadas"
          [sticky]="false"
          [scrollFade]="false"
        >
          <afi-table
            [columns]="resumenColumns"
            [rows]="resumenRows()"
            density="compact"
            [rowHoverable]="false"
            trackByKey="id"
          />
        </afi-page-header>
      </div>
    } @else {
      <div class="ol-empty">
        <h2 class="ol-empty__title">Optimización de la liquidez</h2>
        <p class="ol-empty__hint">
          Activa la optimización para visualizar cómo se verá tu evolución financiera.
        </p>
        <div class="ol-empty__action">
          <afi-button
            variant="primary"
            size="md"
            iconStart="power"
            (clicked)="setOptimizacionLiquidezEstablished(true)"
            ariaLabel="Activar optimización de la liquidez"
          >
            <svg
              slot="iconStart"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 2v10" />
              <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
            </svg>
            Activar optimización de la liquidez
          </afi-button>
        </div>
      </div>
    }
  </afi-page-header>
</site-objetivos-page-shell>
