<afi-modal
  [open]="open()"
  [title]="title()"
  size="md"
  [closeOnEsc]="true"
  [closeOnBackdrop]="false"
  (openChange)="$event ? null : onCancel()"
>
  <div class="ig-form">
    <!-- Concepto -->
    <afi-input
      label="Concepto"
      placeholder="Ej. Salario, Alquiler, Herencia Manuel"
      [value]="concepto()"
      (valueChange)="setConcepto($event)"
    />

    <!-- Importe -->
    <afi-input
      label="Importe"
      type="number"
      suffix="€"
      [value]="valor()"
      (valueChange)="setValor($event)"
    />

    <!-- Frecuencia -->
    <afi-select
      label="Frecuencia"
      [options]="frecuenciaOptions"
      [value]="frecuencia()"
      (valueChange)="setFrecuencia($event)"
    />

    <!-- Es futuro? -->
    <div class="ig-form__field">
      <label class="ig-form__label">{{ futuroLabel() }}</label>
      <afi-radio-group [ariaLabel]="futuroLabel()">
        <afi-radio-group-item
          value="si"
          label="Sí"
          [selected]="isFuturo()"
          (selectedChange)="setIsFuturo(true)"
        />
        <afi-radio-group-item
          value="no"
          label="No"
          [selected]="!isFuturo()"
          (selectedChange)="setIsFuturo(false)"
        />
      </afi-radio-group>
    </div>

    <!-- Inicio (only when futuro) -->
    @if (isFuturo()) {
      <afi-select
        label="Inicio"
        [options]="inicioOptions"
        [value]="inicioKind()"
        (valueChange)="setInicioKind($event)"
      />
      @if (showsInicioValueInput()) {
        <afi-input
          [label]="inicioValueLabel()"
          type="number"
          [value]="inicioValue() ?? ''"
          (valueChange)="setInicioValue($event)"
        />
      }
    }

    <!-- Finalización -->
    <afi-select
      label="Finalización"
      [options]="finalizacionOptions"
      [value]="finalizacionKind()"
      (valueChange)="setFinalizacionKind($event)"
    />
    @if (showsFinalizacionHijo()) {
      <afi-select
        label="Hijo"
        placeholder="Selecciona"
        [options]="hijoOptions()"
        [value]="finalizacionHijoId()"
        (valueChange)="setFinalizacionHijo($event)"
      />
    }
    @if (showsFinalizacionValue()) {
      <afi-input
        [label]="finalizacionValueLabel()"
        type="number"
        [value]="finalizacionValue() ?? ''"
        (valueChange)="setFinalizacionValue($event)"
      />
    }

    <!-- Incrementa con IPC? -->
    <div class="ig-form__field">
      <label class="ig-form__label">¿Incrementa con IPC?</label>
      <afi-radio-group ariaLabel="¿Incrementa con IPC?">
        <afi-radio-group-item
          value="si"
          label="Sí"
          [selected]="incrementaIPC()"
          (selectedChange)="setIncrementaIPC(true)"
        />
        <afi-radio-group-item
          value="no"
          label="No"
          [selected]="!incrementaIPC()"
          (selectedChange)="setIncrementaIPC(false)"
        />
      </afi-radio-group>
    </div>

    <!-- Incremento manual (only when IPC = No) -->
    @if (!incrementaIPC()) {
      <afi-input
        label="Incremento manual"
        type="number"
        suffix="%"
        hint="Porcentaje de crecimiento anual"
        [value]="incrementoManualPct()"
        (valueChange)="setIncremento($event)"
      />
    }
  </div>

  <ng-container slot="footer">
    <afi-button
      variant="ghost"
      size="md"
      (clicked)="onCancel()"
      ariaLabel="Cancelar"
    >
      Cancelar
    </afi-button>
    <afi-button
      variant="primary"
      size="md"
      (clicked)="onSubmit()"
      ariaLabel="Guardar"
    >
      Guardar
    </afi-button>
  </ng-container>
</afi-modal>
