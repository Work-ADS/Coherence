<site-demo-shell
  [views]="views()"
  [demoSlug]="demoSlug()"
  [demoRoute]="demoRoute()"
  homeRoute="/listado-planificaciones"
  homeLabel="Volver al listado"
>
  <div class="ops">
    <site-product-identity-bar
      productLabel="Wealth Planner"
      [pageTitle]="pageTitle()"
      [breadcrumb]="identityBreadcrumb()"
    />
    <div class="ops__body">
    <site-planner-sidebar [activeKey]="activeKey()" />

    <div class="ops__main">
      <site-planner-top-bar
        decisionesRoute="/demos/wealth-planner-2026"
        [clientName]="clientName()"
      />

      @if (showBanner()) {
        <site-objetivos-banner />
      }

      <main class="ops__scroll">
        <div class="ops__page">
          <!--
            The consuming page renders its own <afi-page-header> as the first
            child of this slot (with `slot="breadcrumb"` / `slot="actions"` /
            etc as needed), followed by the page body.
          -->
          <ng-content />

          <div class="ops__version-toggle">
            <site-version-toggle
              [versions]="versions"
              [value]="version()"
              [ariaLabel]="versionAriaLabel()"
              (valueChange)="setVersion($event)"
            />
          </div>
        </div>
      </main>
    </div>
    </div>
  </div>
</site-demo-shell>
