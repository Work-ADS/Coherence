<div class="ptb">
  <!-- Left cluster: plan switcher · identity · state -->
  <div class="ptb__start">
    <!-- Plan switcher: tooltip + dual-icon button + dropdown panel -->
    <div class="ptb__anchor">
      <afi-tooltip text="Cambiar planificación" position="bottom">
        <afi-icon-button
          ariaLabel="Cambiar planificación"
          variant="ghost"
          size="md"
          [expanded]="plansOpen()"
          (clicked)="plansOpen.set(!plansOpen())"
        >
          <span class="ptb__nav-icons" aria-hidden="true">
            <svg class="ptb__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6" />
            </svg>
            <svg class="ptb__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12h.01" /><path d="M3 18h.01" /><path d="M3 6h.01" />
              <path d="M8 12h13" /><path d="M8 18h13" /><path d="M8 6h13" />
            </svg>
          </span>
        </afi-icon-button>
      </afi-tooltip>

      <afi-dropdown-panel
        [open]="plansOpen()"
        ariaLabel="Planificaciones"
        [width]="280"
        (closed)="plansOpen.set(false)"
      >
        <p slot="header" class="ptb__plans-heading">Planificaciones</p>
        <div slot="body" class="ptb__plans">
          <a
            [routerLink]="listadoRoute()"
            class="ptb__plans-link"
            (click)="plansOpen.set(false)"
          >
            <svg class="ptb__plans-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m12 19-7-7 7-7" /><path d="M19 12H5" />
            </svg>
            <span>Ir al listado</span>
          </a>
          <afi-menu-divider />
          @for (p of plans; track p.id) {
            <button
              type="button"
              class="ptb__plans-item"
              (click)="selectPlan(p.id)"
            >
              <span class="ptb__plans-info">
                <span class="ptb__plans-name">{{ p.name }}</span>
                <span class="ptb__plans-id">{{ p.id }}</span>
              </span>
              @if (p.id === simId()) {
                <svg class="ptb__plans-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="20 6 9 17 4 12" />
                </svg>
              }
            </button>
          }
        </div>
      </afi-dropdown-panel>
    </div>

    <!-- Identity: client name + label + inline-edit simId -->
    <div class="ptb__identity">
      <span class="ptb__client">{{ clientName() }} planificación:</span>
      <afi-inline-edit
        [value]="simId()"
        ariaLabel="nombre de la planificación"
        (committed)="onRename($event)"
      />
    </div>

    <!-- State chip + dropdown -->
    <div class="ptb__anchor">
      <afi-status-chip
        [estado]="estado()"
        [interactive]="true"
        size="sm"
        (triggered)="stateOpen.set(!stateOpen())"
      />
      <afi-dropdown-panel
        [open]="stateOpen()"
        ariaLabel="Cambiar estado"
        [width]="220"
        (closed)="stateOpen.set(false)"
      >
        <p slot="header" class="ptb__plans-heading">Estado</p>
        <div slot="body" class="ptb__states">
          @for (s of estados; track s.value) {
            <button
              type="button"
              class="ptb__plans-item"
              (click)="onEstadoChange(s.value)"
            >
              <afi-status-chip [estado]="s.value" size="sm" />
              @if (s.value === estado()) {
                <svg class="ptb__plans-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="20 6 9 17 4 12" />
                </svg>
              }
            </button>
          }
        </div>
      </afi-dropdown-panel>
    </div>
  </div>

  <!-- Right cluster: notes + settings -->
  <div class="ptb__end">
    <site-notes-dropdown
      [open]="notesOpen()"
      [notes]="notes()"
      (closed)="notesOpen.set(false)"
      (noteAdded)="addNote($event)"
      (noteDeleted)="deleteNote($event)"
    >
      <afi-tooltip text="Notas" position="bottom">
        <afi-icon-button
          ariaLabel="Notas"
          variant="ghost"
          size="md"
          [expanded]="notesOpen()"
          (clicked)="notesOpen.set(!notesOpen())"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z" />
            <path d="M15 3v5h5" />
            <path d="M8 13h8" />
            <path d="M8 17h5" />
          </svg>
        </afi-icon-button>
      </afi-tooltip>
    </site-notes-dropdown>

    <site-settings-dropdown
      [open]="configOpen()"
      [settings]="simulationSettings()"
      (closed)="configOpen.set(false)"
      (settingsChanged)="onSettingsChanged($event)"
    >
      <afi-tooltip text="Ajustes de la simulación" position="bottom">
        <afi-icon-button
          ariaLabel="Ajustes de la simulación"
          variant="ghost"
          size="md"
          [expanded]="configOpen()"
          (clicked)="configOpen.set(!configOpen())"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </afi-icon-button>
      </afi-tooltip>
    </site-settings-dropdown>
  </div>
</div>

<afi-toast
  [message]="toastMessage()"
  [visible]="toastVisible()"
  (undo)="onToastUndo()"
  (dismissed)="hideToast()"
/>
