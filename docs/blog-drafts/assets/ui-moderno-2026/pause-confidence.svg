<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="system-ui, -apple-system, sans-serif">
  <style>
    @keyframes bg-instant {
      0%, 39% { fill: #FFFFFF; stroke: #CBD5E0; }
      40%, 41% { fill: #E2E8F0; stroke: #94A3B8; }
      42%, 84% { fill: #3B82F6; stroke: #3B82F6; }
      85%, 100% { fill: #FFFFFF; stroke: #CBD5E0; }
    }
    @keyframes bg-paced {
      0%, 39% { fill: #FFFFFF; stroke: #CBD5E0; }
      40%, 54% { fill: #E2E8F0; stroke: #94A3B8; }
      55%, 84% { fill: #3B82F6; stroke: #3B82F6; }
      85%, 100% { fill: #FFFFFF; stroke: #CBD5E0; }
    }
    @keyframes label-instant {
      0%, 39% { opacity: 1; }
      42%, 85% { opacity: 0; }
      87%, 100% { opacity: 1; }
    }
    @keyframes label-paced {
      0%, 39% { opacity: 1; }
      45%, 85% { opacity: 0; }
      87%, 100% { opacity: 1; }
    }
    @keyframes check-instant {
      0%, 41% { opacity: 0; }
      43%, 84% { opacity: 1; }
      86%, 100% { opacity: 0; }
    }
    @keyframes check-paced {
      0%, 54% { opacity: 0; }
      56%, 84% { opacity: 1; }
      86%, 100% { opacity: 0; }
    }
    @keyframes spinner-paced {
      0%, 44% { opacity: 0; }
      45%, 54% { opacity: 1; }
      56%, 100% { opacity: 0; }
    }
    @keyframes spinner-dot {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .btn-instant { animation: bg-instant 3s infinite; }
    .btn-paced { animation: bg-paced 3s infinite; }
    .lbl-instant { animation: label-instant 3s infinite; }
    .lbl-paced { animation: label-paced 3s infinite; }
    .chk-instant { animation: check-instant 3s infinite; }
    .chk-paced { animation: check-paced 3s infinite; }
    .spn-paced { animation: spinner-paced 3s infinite; }
    .spn-dot { animation: spinner-dot 0.6s infinite; }
    .spn-dot-2 { animation-delay: 0.2s; }
    .spn-dot-3 { animation-delay: 0.4s; }
  </style>

  <rect width="600" height="380" fill="#F5F6FA"/>

  <text x="300" y="32" fill="#94A3B8" font-size="11" letter-spacing="1" text-anchor="middle">ACCIONES DE ALTO IMPACTO</text>
  <text x="300" y="56" fill="#1A2434" font-size="17" font-weight="600" text-anchor="middle">La pausa que genera confianza</text>

  <!-- ROW 1: Instantáneo -->
  <g transform="translate(0, 110)">
    <text x="100" y="44" fill="#94A3B8" font-size="11" letter-spacing="1" text-anchor="middle">INSTANTÁNEO</text>
    <text x="100" y="64" fill="#6B7280" font-size="11" text-anchor="middle">~50 ms</text>

    <rect class="btn-instant" x="200" y="20" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>

    <text class="lbl-instant" x="300" y="51" fill="#1A2434" font-size="14" font-weight="500" text-anchor="middle">Confirmar pago</text>

    <g class="chk-instant">
      <path d="M 288 47 L 296 55 L 312 39" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="500" y="51" fill="#94A3B8" font-size="12" font-style="italic" text-anchor="middle">se siente roto</text>
  </g>

  <!-- ROW 2: Pausa intencional -->
  <g transform="translate(0, 230)">
    <text x="100" y="44" fill="#3B82F6" font-size="11" letter-spacing="1" text-anchor="middle">PAUSA INTENCIONAL</text>
    <text x="100" y="64" fill="#6B7280" font-size="11" text-anchor="middle">150-250 ms</text>

    <rect class="btn-paced" x="200" y="20" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>

    <text class="lbl-paced" x="300" y="51" fill="#1A2434" font-size="14" font-weight="500" text-anchor="middle">Confirmar pago</text>

    <g class="spn-paced" transform="translate(300, 45)">
      <circle class="spn-dot" cx="-12" cy="0" r="3" fill="#3B82F6"/>
      <circle class="spn-dot spn-dot-2" cx="0" cy="0" r="3" fill="#3B82F6"/>
      <circle class="spn-dot spn-dot-3" cx="12" cy="0" r="3" fill="#3B82F6"/>
    </g>

    <g class="chk-paced">
      <path d="M 288 47 L 296 55 L 312 39" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="500" y="51" fill="#3B82F6" font-size="12" font-style="italic" text-anchor="middle">se siente fiable</text>
  </g>

  <text x="300" y="350" fill="#6B7280" font-size="12" text-anchor="middle">El cerebro necesita un latido visual para confiar en la transacción</text>
</svg>
