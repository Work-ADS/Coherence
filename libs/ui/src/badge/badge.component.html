@if (dot()) {
  <span [class]="dotClasses()" role="img" [attr.aria-label]="ariaLabel()"></span>
} @else {
  <span [class]="classes()">
    @if (indicator()) {
      <span class="afi-badge__indicator" aria-hidden="true"></span>
    }
    @if (icon(); as iconName) {
      <afi-icon class="afi-badge__icon" [name]="iconName" />
    }
    <ng-content />
  </span>
}
