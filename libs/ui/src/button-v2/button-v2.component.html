<button
  [type]="type()"
  [class]="classes()"
  [disabled]="disabled() || loading()"
  [attr.aria-busy]="loading() ? 'true' : null"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-expanded]="ariaExpanded() !== null ? ariaExpanded() : null"
  [attr.aria-haspopup]="ariaHasPopup()"
  [attr.aria-controls]="ariaControls()"
  (click)="onClick($event)"
>
  <span class="btn-v2__icon"><ng-content select="[slot=iconStart]" /></span>
  @if (loading()) {
    <span class="btn-v2__spinner" aria-hidden="true"></span>
    <span class="btn-v2__sr-only">Cargando…</span>
  } @else {
    <span class="btn-v2__label"><ng-content /></span>
  }
  <span class="btn-v2__icon"><ng-content select="[slot=iconEnd]" /></span>
</button>
