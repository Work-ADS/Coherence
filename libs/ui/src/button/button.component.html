<button
  [type]="type()"
  [class]="classes()"
  [disabled]="disabled() || loading()"
  [attr.aria-busy]="loading() ? 'true' : null"
  [attr.aria-label]="ariaLabel()"
  (click)="onClick($event)"
>
  @if (iconStart()) {
    <ng-content select="[slot=iconStart]" />
  }
  @if (!loading()) {
    <ng-content />
  } @else {
    <afi-icon class="btn__spinner" name="loader" />
    <span class="btn__sr-only">Cargando…</span>
  }
  @if (iconEnd()) {
    <ng-content select="[slot=iconEnd]" />
  }
</button>
