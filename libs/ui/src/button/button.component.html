<button
  [type]="type()"
  [class]="classes()"
  [disabled]="disabled() || loading()"
  [attr.aria-busy]="loading() ? 'true' : null"
  [attr.aria-label]="ariaLabel()"
  (click)="onClick($event)"
>
  @if (!loading()) {
    @if (iconStart(); as name) {
      <afi-icon class="btn__icon" [name]="name" />
    }
    <ng-content />
    @if (iconEnd(); as name) {
      <afi-icon class="btn__icon" [name]="name" />
    }
  } @else {
    <afi-icon class="btn__spinner" name="loader" />
    <span class="btn__sr-only">Cargando…</span>
  }
</button>
