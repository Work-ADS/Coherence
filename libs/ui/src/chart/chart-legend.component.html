@if (!hidden()) {
  <div class="flex flex-wrap gap-space-4 mt-space-3 text-body-sm text-neutral-600" role="list"
       [attr.aria-label]="'Leyenda del gráfico'">
    @for (item of items(); track item.label) {
      <div class="inline-flex items-center gap-space-1" role="listitem">
        <svg width="14" height="14" aria-hidden="true">
          <defs>
            <pattern [attr.id]="item.visual.patternId" width="6" height="6" patternUnits="userSpaceOnUse"
                     [attr.patternTransform]="item.visual.texture === 'lines' ? 'rotate(45)' : null">
              <rect width="6" height="6" [attr.fill]="item.visual.color" />
              @switch (item.visual.texture) {
                @case ('dots') {
                  <circle cx="3" cy="3" r="1.2" fill="var(--color-base-white)" opacity="0.4" />
                }
                @case ('lines') {
                  <line x1="0" y1="0" x2="0" y2="6" stroke="var(--color-base-white)" stroke-width="1.5" opacity="0.4" />
                }
                @case ('crosshatch') {
                  <path d="M0,0 L6,6 M6,0 L0,6" stroke="var(--color-base-white)" stroke-width="1" opacity="0.35" />
                }
              }
            </pattern>
          </defs>
          <rect width="14" height="14" rx="2" [attr.fill]="item.visual.patternId ? 'url(#' + item.visual.patternId + ')' : item.visual.color" />
        </svg>
        <span>{{ item.label }}</span>
      </div>
    }
  </div>
}
