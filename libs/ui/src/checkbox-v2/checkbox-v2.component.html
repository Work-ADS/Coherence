<label [class]="rootClasses()">
  <input
    #inputEl
    type="checkbox"
    class="afi-checkbox-v2__input"
    [id]="checkboxId"
    [checked]="checked()"
    [disabled]="disabled()"
    [attr.aria-label]="!label() ? ariaLabel() : null"
    (change)="onToggle($event)"
  />
  <span [class]="boxClasses()" aria-hidden="true">
    <!-- The icon stays mounted so its stroke can draw in/out on toggle rather
         than pop; `--visible` releases the dashoffset. Indeterminate and check
         are separate paths because they draw over different lengths. -->
    <svg
      class="afi-checkbox-v2__icon"
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      @if (indeterminate()) {
        <path
          class="afi-checkbox-v2__dash"
          [class.afi-checkbox-v2__dash--visible]="indeterminate()"
          d="M4 8h8"
        />
      } @else {
        <path
          class="afi-checkbox-v2__check"
          [class.afi-checkbox-v2__check--visible]="checked()"
          d="M13.5 4.5 6.5 12 3 8.5"
        />
      }
    </svg>
  </span>
  @if (label()) {
    <span class="afi-checkbox-v2__label">{{ label() }}</span>
  }
</label>
