<span [class]="rootClasses()">
  <button
    type="button"
    class="afi-chip-v2__body"
    [attr.aria-pressed]="selected()"
    [attr.aria-label]="ariaLabel()"
    [disabled]="disabled()"
    (click)="onToggle()"
  >
    <span class="afi-chip-v2__icon"><ng-content select="[slot=iconStart]" /></span>
    <span class="afi-chip-v2__label">{{ label() }}</span>
  </button>

  @if (removable()) {
    <button
      type="button"
      class="afi-chip-v2__remove"
      [attr.aria-label]="removeAccessibleName()"
      [disabled]="disabled()"
      (click)="onRemove($event)"
    >
      <svg
        class="afi-chip-v2__remove-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>
  }
</span>
