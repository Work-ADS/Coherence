@if (isDropdown()) {
  <button
    type="button"
    [class]="classes()"
    [disabled]="disabled()"
    [attr.aria-haspopup]="'menu'"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="ariaLabel()"
    (click)="onToggle()"
  >
    @if (triggerActive() && hasSelection()) {
      <span
        class="afi-chip__clear"
        role="button"
        tabindex="0"
        aria-label="Limpiar filtros"
        (click)="onClear($event)"
        (keydown.enter)="onClear($event)"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="m15 9-6 6" />
          <path d="m9 9 6 6" />
        </svg>
      </span>
    }
    <span class="afi-chip__label">{{ label() }}</span>
    @if (hasSelection()) {
      <span class="afi-chip__divider" aria-hidden="true"></span>
      <span class="afi-chip__selection">{{ triggerSummary() }}</span>
    }
    <svg class="afi-chip__caret" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path
        fill-rule="evenodd"
        d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
        clip-rule="evenodd"
      />
    </svg>
  </button>

  @if (menuOpen()) {
    <div
      role="menu"
      [attr.aria-label]="dropdownAriaLabel()"
      class="afi-chip__menu"
    >
      @if (showSelectAll()) {
        <button
          type="button"
          role="menuitemcheckbox"
          [attr.aria-checked]="isAllSelected()"
          class="afi-chip__menu-row afi-chip__menu-row--all"
          (click)="toggleSelectAll($event)"
        >
          <span class="afi-chip__menu-check" [class.afi-chip__menu-check--on]="isAllSelected()">
            @if (isAllSelected()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            }
          </span>
          <span class="afi-chip__menu-label">{{ selectAllLabel() }}</span>
        </button>
        <div class="afi-chip__menu-divider" aria-hidden="true"></div>
      }
      @for (option of options(); track option.value) {
        <button
          type="button"
          role="menuitemcheckbox"
          [attr.aria-checked]="isOptionSelected(option.value)"
          class="afi-chip__menu-row"
          (click)="toggleOption(option.value, $event)"
        >
          <span
            class="afi-chip__menu-check"
            [class.afi-chip__menu-check--on]="isOptionSelected(option.value)"
          >
            @if (isOptionSelected(option.value)) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            }
          </span>
          <span class="afi-chip__menu-label">{{ option.label }}</span>
          @if (option.count !== undefined && option.count !== null) {
            <span class="afi-chip__menu-count">{{ option.count }}</span>
          }
        </button>
      }
    </div>
  }
} @else {
  <button
    type="button"
    role="checkbox"
    [class]="classes()"
    [disabled]="disabled()"
    [attr.aria-checked]="selected()"
    [attr.aria-label]="ariaLabel()"
    (click)="onToggle()"
  >
    <ng-content select="[slot=iconStart]" />
    <span class="afi-chip__label">{{ label() }}</span>
    @if (hasCount()) {
      <span class="afi-chip__count" aria-hidden="true">{{ count() }}</span>
    }
    @if (dismissable()) {
      <span
        class="afi-chip__dismiss"
        role="button"
        tabindex="0"
        aria-label="Eliminar filtro"
        (click)="onDismiss($event)"
        (keydown.enter)="onDismiss($event)"
      >
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
            clip-rule="evenodd"
          />
        </svg>
      </span>
    }
  </button>
}
