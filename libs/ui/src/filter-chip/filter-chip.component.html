<span [class]="classes()">
  @if (showReset()) {
    <button
      type="button"
      class="afi-chip__x afi-chip__x--lead"
      [attr.aria-label]="'Quitar filtro de ' + label()"
      (click)="onReset()"
    >
      <afi-icon name="x" />
    </button>
  }

  <button
    type="button"
    class="afi-chip__body"
    [disabled]="disabled()"
    [attr.aria-pressed]="isTrigger() ? null : selected()"
    [attr.aria-haspopup]="isTrigger() ? (isDropdown() ? 'menu' : 'listbox') : null"
    [attr.aria-expanded]="isTrigger() ? isOpen() : null"
    [attr.aria-controls]="isTrigger() && isOpen() ? controls() : null"
    [attr.aria-activedescendant]="isTrigger() && isOpen() ? activeId() : null"
    [attr.aria-label]="ariaLabel()"
    [attr.title]="appliedText() !== null ? label() + ': ' + appliedText() : null"
    (click)="onToggle()"
  >
    <ng-content select="[slot=iconStart]" />
    <span class="afi-chip__label">{{ label() }}</span>
    @if (appliedText(); as applied) {
      <span class="afi-chip__divider" aria-hidden="true"></span>
      <span class="afi-chip__selection afi-chip__value">{{ applied }}</span>
    }
    @if (hasCount()) {
      <span class="afi-chip__count" aria-hidden="true">{{ count() }}</span>
    }
    @if (isTrigger()) {
      <afi-icon class="afi-chip__caret" name="chevron-down" />
    }
  </button>

  @if (showClear()) {
    <button
      type="button"
      class="afi-chip__x"
      [attr.aria-label]="'Borrar ' + label()"
      (click)="onClearValue()"
    >
      <afi-icon name="x" />
    </button>
  }
  @if (showRemove()) {
    <button
      type="button"
      class="afi-chip__x"
      [attr.aria-label]="'Quitar filtro de ' + label()"
      (click)="onRemove()"
    >
      <afi-icon name="x" />
    </button>
  }
</span>

@if (isDropdown() && menuOpen()) {
  <div #panelEl role="menu" [attr.aria-label]="dropdownAriaLabel()" class="afi-chip__menu">
    @if (showSelectAll()) {
      <button
        type="button"
        role="menuitemcheckbox"
        [attr.aria-checked]="isAllSelected()"
        class="afi-chip__menu-row afi-chip__menu-row--all"
        (click)="toggleSelectAll($event)"
      >
        <span class="afi-chip__menu-check" [class.afi-chip__menu-check--on]="isAllSelected()">
          @if (isAllSelected()) {
            <afi-icon name="check" />
          }
        </span>
        <span class="afi-chip__menu-label">{{ selectAllLabel() }}</span>
      </button>
      <div class="afi-chip__menu-divider" aria-hidden="true"></div>
    }
    @for (option of options(); track option.value) {
      <button
        type="button"
        role="menuitemcheckbox"
        [attr.aria-checked]="isOptionSelected(option.value)"
        class="afi-chip__menu-row"
        (click)="toggleOption(option.value, $event)"
      >
        <span
          class="afi-chip__menu-check"
          [class.afi-chip__menu-check--on]="isOptionSelected(option.value)"
        >
          @if (isOptionSelected(option.value)) {
            <afi-icon name="check" />
          }
        </span>
        <span class="afi-chip__menu-label">{{ option.label }}</span>
        @if (option.count !== undefined && option.count !== null) {
          <span class="afi-chip__menu-count">{{ option.count }}</span>
        }
      </button>
    }
  </div>
}
