<button
  [type]="type()"
  [class]="classes()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-expanded]="ariaExpanded() !== null ? ariaExpanded() : null"
  [attr.aria-haspopup]="ariaHasPopup()"
  [attr.aria-controls]="ariaControls()"
  (click)="onClick($event)"
>
  <span class="afi-icon-button-v2__icon"><ng-content /></span>
</button>
