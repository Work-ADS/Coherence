@if (label()) {
  <label [for]="inputId" class="afi-input__label">
    {{ label() }}
    @if (required()) {
      <span class="afi-input__required" aria-hidden="true"> *</span>
    }
  </label>
}

@if (type() === 'textarea') {
  <textarea
    [id]="inputId"
    [class]="fieldClasses()"
    [placeholder]="placeholder() ?? ''"
    [disabled]="disabled()"
    [readOnly]="readonly()"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-label]="ariaLabel()"
    [value]="value() ?? ''"
    rows="4"
    (input)="onInput($event)"
    (focus)="focused.emit($event)"
    (blur)="blurred.emit($event)"
  ></textarea>
} @else if (hasAdornment()) {
  <div [class]="shellClasses()">
    @if (prefix()) {
      <span class="afi-input__prefix" aria-hidden="true">{{ prefix() }}</span>
    }
    <input
      [id]="inputId"
      [type]="type()"
      [class]="fieldClasses()"
      [attr.data-type]="type()"
      [placeholder]="placeholder() ?? ''"
      [disabled]="disabled()"
      [readOnly]="readonly()"
      [attr.aria-required]="required() ? 'true' : null"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      [attr.aria-label]="ariaLabel()"
      [attr.autocomplete]="autocomplete()"
      [value]="value() ?? ''"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      (focus)="focused.emit($event)"
      (blur)="blurred.emit($event)"
    />
    @if (suffix()) {
      <span class="afi-input__suffix" aria-hidden="true">{{ suffix() }}</span>
    }
  </div>
} @else {
  <input
    [id]="inputId"
    [type]="type()"
    [class]="fieldClasses()"
    [attr.data-type]="type()"
    [placeholder]="placeholder() ?? ''"
    [disabled]="disabled()"
    [readOnly]="readonly()"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-label]="ariaLabel()"
    [attr.autocomplete]="autocomplete()"
    [value]="value() ?? ''"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (focus)="focused.emit($event)"
    (blur)="blurred.emit($event)"
  />
}

@if (hint() && !error()) {
  <p [id]="hintId" class="afi-input__hint">{{ hint() }}</p>
}

@if (error()) {
  <p [id]="errorId" class="afi-input__error" role="alert">{{ error() }}</p>
}
