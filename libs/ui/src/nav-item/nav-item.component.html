<ng-template #body>
  <!-- Leading mark: a numbered chip (wizard nav) or the icon slot -->
  @if (step() !== null) {
    <span class="nav-item__step" aria-hidden="true">{{ step() }}</span>
  } @else if (showIcon()) {
    <span class="nav-item__icon">
      <ng-content select="[slot=icon]" />
    </span>
  }

  <!-- Label (hidden when collapsed via parent CSS) -->
  <span
    class="nav-item__label"
    [class.is-collapsed]="!sidebarExpanded()">
    {{ label() }}
  </span>

  <!-- Trailing slot: neutral count, chevron, anything small -->
  <span class="nav-item__trail">
    <ng-content select="[slot=trailing]" />
  </span>

  <!-- Badge -->
  @if (badge() !== null) {
    <span class="nav-item__badge">
      {{ badge() }}
    </span>
  }

  <!-- Chevron (right) -->
  @if (chevron() === 'right') {
    <svg
      class="nav-item__chevron"
      [class.is-expanded]="expanded()"
      viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M6.22 4.22a.75.75 0 011.06 0l3.25 3.25a.75.75 0 010 1.06l-3.25 3.25a.75.75 0 01-1.06-1.06L8.94 8 6.22 5.28a.75.75 0 010-1.06z" />
    </svg>
  }

  @if (reasonShown()) {
    <span class="nav-item__reason" [id]="reasonId">{{ disabledReason() }}</span>
  }
</ng-template>

@if (tag() === 'a') {
  <a
    class="nav-item"
    [class.is-active]="isSelected()"
    [class.is-disabled]="disabled()"
    [attr.href]="disabled() ? null : href()"
    [attr.aria-current]="isSelected() ? 'page' : null"
    [attr.aria-disabled]="disabled() ? 'true' : null"
    [attr.aria-describedby]="reasonShown() ? reasonId : null"
    [attr.role]="disabled() ? 'link' : null"
    [attr.tabindex]="disabled() ? (reasonShown() ? 0 : -1) : null"
    [attr.aria-label]="label()"
    [attr.title]="label()">
    <ng-container *ngTemplateOutlet="body" />
  </a>
} @else {
  <button
    type="button"
    class="nav-item"
    [class.is-active]="isSelected()"
    [class.is-disabled]="disabled()"
    [attr.aria-current]="isSelected() ? 'page' : null"
    [attr.aria-disabled]="disabled() && reasonShown() ? 'true' : null"
    [attr.aria-describedby]="reasonShown() ? reasonId : null"
    [attr.aria-label]="label()"
    [attr.title]="label()"
    [disabled]="disabled() && !reasonShown()">
    <ng-container *ngTemplateOutlet="body" />
  </button>
}

<!-- Custom DS tooltip — always rendered, revealed on hover via CSS. The
     button also carries a native title attribute as a fallback for
     truncated labels in expanded sidebar widths. -->
<span role="tooltip" class="nav-item__tooltip">
  {{ label() }}
</span>
