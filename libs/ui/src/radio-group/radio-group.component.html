<fieldset
  [class]="fieldsetClasses()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-labelledby]="ariaLabelledBy()"
  [attr.aria-required]="required() ? 'true' : null"
  [attr.aria-invalid]="error() ? 'true' : null"
  [attr.aria-describedby]="describedBy()"
  role="radiogroup"
>
  @if (legend(); as legendText) {
    <legend class="afi-radio-group__legend">
      {{ legendText }}
      @if (required()) {
        <span class="afi-radio-group__required" aria-hidden="true">*</span>
      }
      @if (help(); as helpText) {
        <afi-field-help [help]="helpText" [helpLabel]="helpLabel()" [label]="legendText" />
      }
    </legend>
  }
  @for (option of options(); track option.value) {
    <afi-radio-group-item
      [value]="option.value"
      [label]="option.label"
      [hint]="option.description ?? null"
      [disabled]="option.disabled ?? false"
    />
  }
  <ng-content />
  @if (hint() && !error()) {
    <p [id]="hintId" class="afi-radio-group__hint">{{ hint() }}</p>
  }
  @if (error()) {
    <p [id]="errorId" class="afi-radio-group__error">{{ error() }}</p>
  }
</fieldset>
