@if (label()) {
  <label [for]="inputId" [id]="labelId" class="afi-search__label">
    {{ label() }}
  </label>
}

<div [class]="rootClasses()">
  <svg
    class="afi-search__icon"
    viewBox="0 0 20 20"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="9" cy="9" r="6" />
    <line x1="14" y1="14" x2="17" y2="17" />
  </svg>

  <input
    #inputEl
    type="search"
    [attr.role]="hasSuggestions() ? 'combobox' : 'searchbox'"
    [attr.aria-autocomplete]="hasSuggestions() ? 'list' : null"
    [attr.aria-expanded]="hasSuggestions() ? comboboxExpanded() : null"
    [attr.aria-controls]="hasSuggestions() ? suggestionsId : null"
    [attr.aria-activedescendant]="
      showSuggestions() && activeIndex() >= 0
        ? suggestionsId + '-' + activeIndex()
        : null
    "
    [id]="inputId"
    class="afi-search__field"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [value]="value()"
    [attr.aria-label]="!label() ? ariaLabel() : null"
    [attr.aria-labelledby]="label() ? labelId : null"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />

  @if (hasValue() && !disabled()) {
    <button
      type="button"
      class="afi-search__clear"
      aria-label="Borrar búsqueda"
      (mousedown)="$event.preventDefault()"
      (click)="clear()"
    >
      <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path
          fill-rule="evenodd"
          d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
  }
</div>

@if (showSuggestions()) {
  <div
    [id]="suggestionsId"
    role="listbox"
    class="afi-search__suggestions"
  >
    @for (
      suggestion of suggestions();
      let i = $index;
      track suggestionKey(i, suggestion)
    ) {
      <button
        type="button"
        role="option"
        [id]="suggestionsId + '-' + i"
        [attr.aria-selected]="i === activeIndex()"
        [class]="
          'afi-search__suggestion' +
          (i === activeIndex() ? ' afi-search__suggestion--active' : '')
        "
        (mousedown)="$event.preventDefault()"
        (mouseenter)="activeIndex.set(i)"
        (click)="onPick(suggestion)"
      >
        <svg
          class="afi-search__suggestion-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <span class="afi-search__suggestion-text">
          <span class="afi-search__suggestion-label">{{ suggestion.label }}</span>
          @if (suggestion.description) {
            <span class="afi-search__suggestion-description">
              {{ suggestion.description }}
            </span>
          }
        </span>
        @if (suggestion.trailing) {
          <span class="afi-search__suggestion-trailing">
            {{ suggestion.trailing }}
          </span>
        }
      </button>
    }
  </div>
} @else if (showEmptyMessage()) {
  <div class="afi-search__suggestions afi-search__suggestions--empty">
    {{ emptyMessage() }}
  </div>
}
