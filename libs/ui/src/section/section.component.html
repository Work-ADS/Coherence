@if (isCollapsible()) {
  <button
    type="button"
    class="afi-section__head afi-section__head--button"
    [attr.aria-expanded]="isExpanded()"
    [attr.aria-controls]="bodyId"
    [attr.aria-label]="ariaLabel()"
    (click)="onToggle()"
  >
    <span class="afi-section__text">
      @if (hasEyebrow()) {
        <span class="afi-section__eyebrow">{{ eyebrow() }}</span>
      }
      @if (hasTitle()) {
        <h2 class="afi-section__title">{{ title() }}</h2>
      }
      @if (hasSubtitle()) {
        <span class="afi-section__subtitle">{{ subtitle() }}</span>
      }
    </span>
    @if (complete()) {
      <span class="afi-section__complete" aria-label="Sección completa">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path
            d="M3.5 8.5l3 3 6-7"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    }
    @if (hasCount()) {
      <span class="afi-section__count">{{ count() }}</span>
    }
    <span class="afi-section__actions" (click)="$event.stopPropagation()">
      <ng-content select="[slot=header-actions]"></ng-content>
    </span>
    <span class="afi-section__chevron" aria-hidden="true">
      <svg viewBox="0 0 12 12" width="12" height="12">
        <path
          d="M3 4.5l3 3 3-3"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>
  </button>
} @else {
  <header class="afi-section__head">
    <div class="afi-section__text">
      @if (hasEyebrow()) {
        <span class="afi-section__eyebrow">{{ eyebrow() }}</span>
      }
      @if (hasTitle()) {
        <h2 class="afi-section__title">{{ title() }}</h2>
      }
      @if (hasSubtitle()) {
        <p class="afi-section__subtitle">{{ subtitle() }}</p>
      }
    </div>
    @if (complete()) {
      <span class="afi-section__complete" aria-label="Sección completa">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path
            d="M3.5 8.5l3 3 6-7"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    }
    @if (hasCount()) {
      <span class="afi-section__count">{{ count() }}</span>
    }
    <span class="afi-section__actions">
      <ng-content select="[slot=header-actions]"></ng-content>
    </span>
  </header>
}

<div
  [id]="bodyId"
  class="afi-section__body"
  [attr.hidden]="isExpanded() ? null : ''"
>
  <ng-content></ng-content>
</div>
