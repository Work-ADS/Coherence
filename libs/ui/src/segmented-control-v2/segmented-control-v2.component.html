<div
  #track
  class="afi-segmented-control-v2"
  role="radiogroup"
  [attr.aria-label]="ariaLabel()"
  (keydown)="onKeydown($event)"
>
  <!-- Sliding pill — sits behind the transparent segments and marks the selected one. -->
  <div
    class="afi-segmented-control-v2__indicator"
    [class.afi-segmented-control-v2__indicator--animated]="animate()"
    [class.afi-segmented-control-v2__indicator--disabled]="activeDisabled()"
    [style.transform]="indicatorTransform()"
    [style.width.px]="indicatorWidth()"
    aria-hidden="true"
  ></div>

  @for (option of options(); track option.value; let i = $index) {
    <button
      #optionEl
      type="button"
      role="radio"
      class="afi-segmented-control-v2__segment"
      [class.afi-segmented-control-v2__segment--selected]="option.value === value()"
      [attr.aria-checked]="option.value === value()"
      [disabled]="option.disabled ?? false"
      [tabindex]="option.value === value() ? 0 : -1"
      (click)="select(i)"
    >
      <span class="afi-segmented-control-v2__label">{{ option.label }}</span>
    </button>
  }
</div>
