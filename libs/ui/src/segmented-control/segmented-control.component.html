<ng-template #group>
  <div
    class="seg-control"
    [class.seg-control--sm]="size() === 'sm'"
    [class.seg-control--md]="size() === 'md'"
    [class.seg-control--lg]="size() === 'lg'"
    [class.seg-control--solid]="appearance() === 'solid'"
    [class.seg-control--full]="fullWidth()"
    [class.seg-control--disabled]="disabled()"
    [class.seg-control--error]="!!error()"
    [class.seg-control--idle]="!measured()"
    [class.seg-control--nothumb]="!measured() || indicatorWidth() === 0"
    role="radiogroup"
    [attr.aria-label]="label() ? null : ariaLabel()"
    [attr.aria-labelledby]="label() ? legendId : null"
    [attr.aria-disabled]="disabled() ? 'true' : null"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (keydown)="onKeydown($event)"
  >
    <!-- Sliding thumb. Hidden by the stylesheet where the brand renders
         radio cards instead — those mark selection with their own radio dot. -->
    <div
      class="seg-control__indicator"
      [style.transform]="indicatorTransform()"
      [style.width.px]="indicatorWidth()"
      [style.height.px]="indicatorHeight()"
      aria-hidden="true"
    ></div>

    @for (option of options(); track option.value) {
      <button
        #optionEl
        type="button"
        role="radio"
        [attr.aria-checked]="option.value === value()"
        [attr.aria-label]="option.ariaLabel ?? null"
        [attr.tabindex]="tabIndexFor(option)"
        class="seg-control__option"
        [class.seg-control__option--active]="option.value === value()"
        [class.seg-control__option--disabled]="(option.disabled ?? false) || disabled()"
        [class.seg-control__option--icon]="!!option.icon && !option.label"
        [disabled]="(option.disabled ?? false) || disabled()"
        (click)="select(option)"
      >
        @if (option.icon; as iconName) {
          <afi-icon class="seg-control__icon" [name]="iconName" />
        }
        @if (option.label) {
          <span class="seg-control__label">{{ option.label }}</span>
        }
        @if (option.count !== undefined) {
          <span class="seg-control__count" aria-hidden="true">{{ option.count }}</span>
        }
        @if (option.dot) {
          <span class="seg-control__dot" aria-hidden="true"></span>
        }
        @if (option.meta) {
          <span class="seg-control__meta">{{ option.meta }}</span>
        }
      </button>
    }
  </div>
</ng-template>

@if (label(); as legendText) {
  <fieldset class="seg-field">
    <legend [id]="legendId" class="seg-field__legend">
      {{ legendText }}
      @if (required()) {
        <span class="seg-field__required" aria-hidden="true">*</span>
      }
      @if (help(); as helpText) {
        <afi-field-help [help]="helpText" [helpLabel]="helpLabel()" [label]="legendText" />
      }
    </legend>
    <ng-container [ngTemplateOutlet]="group" />
    @if (hint() && !error()) {
      <p [id]="hintId" class="seg-field__hint">{{ hint() }}</p>
    }
    @if (error()) {
      <p [id]="errorId" class="seg-field__error">{{ error() }}</p>
    }
  </fieldset>
} @else {
  <ng-container [ngTemplateOutlet]="group" />
}
