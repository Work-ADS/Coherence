@if (interactive()) {
  <button
    type="button"
    class="status-chip status-chip--interactive"
    [class]="sizeClass()"
    [style]="chipStyle()"
    [attr.data-estado]="estado()"
    [attr.aria-label]="ariaLabel()"
    (click)="triggered.emit()"
  >
    @if (showDot()) {
      <span class="status-chip__dot" [style.background-color]="dotColor()" aria-hidden="true"></span>
    }
    <span>{{ label() }}</span>
    <afi-icon class="status-chip__chevron" name="chevron-down" />
  </button>
} @else {
  <!-- Static text, not a live region: a table of chips must not announce itself. -->
  <span
    class="status-chip"
    [class]="sizeClass()"
    [style]="chipStyle()"
    [attr.data-estado]="estado()"
  >
    @if (showDot()) {
      <span class="status-chip__dot" [style.background-color]="dotColor()" aria-hidden="true"></span>
    }
    <span>{{ label() }}</span>
  </span>
}
