@if (interactive()) {
  <button
    type="button"
    class="status-chip status-chip--interactive"
    [class]="sizeClass()"
    [style]="chipStyle()"
    [attr.data-estado]="estado()"
    [attr.aria-label]="computedAriaLabel()"
    aria-haspopup="menu"
    (click)="triggered.emit()"
  >
    @if (showDot()) {
      <span class="status-chip__dot" [style.background-color]="dotColor()" aria-hidden="true"></span>
    }
    <span>{{ label() }}</span>
    <svg class="status-chip__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/>
    </svg>
  </button>
} @else {
  <span
    class="status-chip"
    [class]="sizeClass()"
    [style]="chipStyle()"
    [attr.data-estado]="estado()"
    [attr.aria-label]="computedAriaLabel()"
    role="status"
  >
    @if (showDot()) {
      <span class="status-chip__dot" [style.background-color]="dotColor()" aria-hidden="true"></span>
    }
    <span>{{ label() }}</span>
  </span>
}
