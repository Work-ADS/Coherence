<div
  #list
  class="afi-tabs-v2"
  role="tablist"
  [attr.aria-label]="ariaLabel()"
  (keydown)="onKeydown($event)"
>
  <ng-content />

  <!-- Sliding underline indicator — sits above the shared baseline in z-order and
       scrolls with the content it marks. -->
  <div
    #indicator
    class="afi-tabs-v2__indicator"
    [class.afi-tabs-v2__indicator--disabled]="activeDisabled()"
    [style.transform]="indicatorTransform()"
    [style.width.px]="indicatorWidth()"
    aria-hidden="true"
  ></div>
</div>
