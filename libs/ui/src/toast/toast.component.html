@if (visible()) {
  <div class="toast__anchor">
    <div
      class="toast__pill"
      [attr.role]="tone() === 'error' ? 'alert' : 'status'"
      [attr.aria-live]="tone() === 'error' ? 'assertive' : 'polite'"
      (mouseenter)="paused.emit(true)"
      (mouseleave)="paused.emit(false)"
      (focusin)="paused.emit(true)"
      (focusout)="paused.emit(false)"
      (keydown.escape)="dismissed.emit()"
    >
      <!-- Message (tone is a leading glyph only) -->
      <span class="toast__message">
        @if (tone() === 'success') {
          <afi-icon class="toast__glyph" name="check" />
        } @else if (tone() === 'error') {
          <afi-icon class="toast__glyph" name="alert" />
        }
        {{ message() }}
      </span>

      <!-- Action (one verb) -->
      @if (showUndo()) {
        <button type="button" class="toast__action" (click)="undo.emit()">
          <span class="toast__action-label">{{ undoLabel() }}</span>
          @if (shortcut().length > 0) {
            <afi-kbd class="toast__shortcut" [keys]="shortcut()" size="sm" />
          }
        </button>
      }

      <!-- Dismiss -->
      <button type="button" class="toast__dismiss" (click)="dismissed.emit()" aria-label="Cerrar aviso">
        <afi-icon class="toast__icon" name="x" />
      </button>
    </div>
  </div>
}
