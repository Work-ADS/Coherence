<label [class]="rootClasses()">
  @if (label()) {
    <span class="afi-toggle-v2__label">{{ label() }}</span>
  }
  <button
    type="button"
    role="switch"
    [id]="toggleId"
    [attr.aria-checked]="checked()"
    [attr.aria-label]="!label() ? ariaLabel() : null"
    [disabled]="disabled()"
    [class]="trackClasses()"
    (click)="onToggle()"
    (keydown.space)="onToggle(); $event.preventDefault()"
  >
    <span class="afi-toggle-v2__thumb" aria-hidden="true"></span>
  </button>
</label>
