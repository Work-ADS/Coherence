<span
  #anchorEl
  class="tooltip"
  [attr.aria-describedby]="disabled() ? null : tooltipId"
  (mouseenter)="onEnter()"
  (mouseleave)="onLeave()"
  (focusin)="onEnter()"
  (focusout)="onLeave()"
  (click)="onClick()"
>
  <ng-content />
  @if (!disabled()) {
    <!-- Always in the DOM so aria-describedby resolves; hidden until shown, then
         portalled by FloatingPanel so no scroll container can clip or widen. -->
    <span
      #bubbleEl
      [id]="tooltipId"
      role="tooltip"
      [class]="popClass()"
      [style.max-inline-size]="maxWidthStyle()">
      {{ text() }}
      @if (shortcut(); as keys) {
        <afi-kbd [keys]="keys" size="sm" class="tooltip__kbd" />
      }
    </span>
  }
</span>
